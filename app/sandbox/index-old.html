<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Developer Sandbox — Logo Stage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="sandbox-menu" aria-label="Developer Sandbox navigation">
        <button class="sandbox-menu__item is-active" data-section="home">
          <span class="menu-icon">⌂</span>
          <span>Home</span>
        </button>

        <button class="sandbox-menu__item" data-section="projects">
          <span class="menu-icon">▱</span>
          <span>Projects</span>
        </button>

        <button class="sandbox-menu__item" data-section="guides">
          <span class="menu-icon">▤</span>
          <span>Guides</span>
        </button>

        <button class="sandbox-menu__item" data-section="rosetta">
          <span class="menu-icon">◇</span>
          <span>Rosetta Stones</span>
        </button>

        <button class="sandbox-menu__item" data-section="system-guide">
          <span class="menu-icon">⊙</span>
          <span>System Guide</span>
        </button>

        <button class="sandbox-menu__item" data-section="lab">
          <span class="menu-icon">⚗</span>
          <span>Lab</span>
        </button>
      </nav>
    </header>
    <main class="sandbox-stage">
      <section
        class="glass-panel panel-left featured-panel"
        id="featured"
        aria-labelledby="featured-heading"
        tabindex="0"
      >
        <header class="featured-panel__header">
          <h2 id="featured-heading">Featured Project</h2>

          <span class="featured-panel__count">
            <span id="featured-current">1</span>/3
          </span>
        </header>

        <div class="featured-carousel">
          <button
            class="featured-arrow featured-arrow--previous"
            id="featured-previous"
            aria-label="Previous featured project"
          >
            ‹
          </button>

          <div class="featured-stack">
            <!-- Decorative windows behind active project -->
            <div
              class="featured-stack__window featured-stack__window--back"
            ></div>
            <div
              class="featured-stack__window featured-stack__window--middle"
            ></div>
            <div
              class="featured-stack__window featured-stack__window--front"
            ></div>

            <!-- Active project -->
            <article class="featured-project">
              <div class="featured-project__image">
                <div class="project-orbit project-orbit--one"></div>
                <div class="project-orbit project-orbit--two"></div>

                <span class="project-star"></span>
              </div>

              <div class="featured-project__content">
                <span class="featured-project__type" id="featured-type">
                  WEB PROJECT
                </span>

                <h3 id="featured-title">Modern Agenda</h3>

                <p id="featured-description">
                  Legacy application transformed with modern Angular and
                  TypeScript.
                </p>

                <div class="featured-project__tags" id="featured-tags"></div>

                <button class="featured-project__button">
                  Explore Project
                  <span>›</span>
                </button>
              </div>
            </article>
          </div>

          <button
            class="featured-arrow featured-arrow--next"
            id="featured-next"
            aria-label="Next featured project"
          >
            ›
          </button>
        </div>

        <div
          class="featured-dots"
          id="featured-dots"
          aria-label="Featured project selector"
        ></div>
      </section>
      <div class="hologram" aria-label="Developer Sandbox logo">
        <div class="hologram__outer-ring"></div>
        <div class="hologram__ring hologram__ring--one"></div>
        <div class="hologram__ring hologram__ring--two"></div>
        <div class="hologram__beam"></div>

        <button class="logo-button" aria-label="Developer Sandbox logo">
          <img
            src="assets/logo-blue.png"
            alt="Horned woman Developer Sandbox logo"
          />
        </button>
      </div>
    </main>
  </body>
</html>
