<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Fine Arts Build Preview | Susan Delgado</title>
  <meta name="description" content="Review-only preview of the proposed shared navigation above Susan Delgado's existing Fine Arts page.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700,700i,800,800i" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/xwc7tgb.css">
  <link rel="stylesheet" href="css/build-style.css">
  <link rel="stylesheet" href="css/build-global.css">
  <link rel="stylesheet" href="css/finearts-build.css">
  <style>.finearts-live-frame{display:block;width:100%;min-height:100vh;border:0;background:#fff}</style>
</head>
<body class="art-build-preview finearts-page-build">
<a class="build-skip" href="#fineArtsFrame">Skip to content</a>
<header class="build-site-header">
  <div class="build-top-tabs">
    <ul class="build-tabs">
      <li class="active"><a href="finearts-build.html" aria-current="page">FINE ARTS</a></li>
      <li><a href="work-build.html">TECHNICAL WORK</a></li>
    </ul>
  </div>
  <div class="build-main-nav">
    <div class="build-main-nav-inner">
      <a class="build-site-brand" href="/index.html">SUSAN DELGADO</a>
      <nav class="build-site-links" aria-label="Fine Arts preview navigation">
        <a href="finearts-build.html" aria-current="page">FINE ARTS</a>
        <a href="about-build.html">ABOUT</a>
        <a href="exhibits-build.html">EXHIBITIONS</a>
        <a href="progress-chronicles-build.html">PROGRESS CHRONICLES</a>
        <a href="contact-build.html">CONTACT</a>
      </nav>
    </div>
  </div>
</header>

<iframe id="fineArtsFrame" class="finearts-live-frame" src="/finearts.html" title="Susan Delgado Fine Arts portfolio" scrolling="no"></iframe>

<footer class="build-footer">
  <div class="build-shell">
    <p class="build-footer-title">&copy; 2026 Susan Nicole Arts | Susan Nicole Delgado</p>
    <p class="build-footer-philosophy">Grounded in the philosophy that <em>“Dreams are the Foundation of Reality.”</em></p>
    <div class="build-footer-links"><a href="contact-build.html">Contact</a><span>|</span><a href="/sitemap.xml" target="_blank">Sitemap</a></div>
  </div>
</footer>

<script>
(function(){
  var frame=document.getElementById('fineArtsFrame');
  if(!frame)return;

  var buildLinks={
    '/narrative-gallery.html':'/narrative-gallery-build.html',
    'narrative-gallery.html':'/narrative-gallery-build.html',
    '/wildlife-gallery.html':'/wildlife-gallery-build.html',
    'wildlife-gallery.html':'/wildlife-gallery-build.html',
    '/decorative-gallery.html':'/decorative-gallery-build.html',
    'decorative-gallery.html':'/decorative-gallery-build.html',
    '/studies-gallery.html':'/studies-gallery-build.html',
    'studies-gallery.html':'/studies-gallery-build.html',
    '/about.html':'/about-build.html',
    'about.html':'/about-build.html',
    '/exhibits.html':'/exhibits-build.html',
    'exhibits.html':'/exhibits-build.html',
    '/progress-chronicles.html':'/progress-chronicles-build.html',
    'progress-chronicles.html':'/progress-chronicles-build.html',
    '/contact.html':'/contact-build.html',
    'contact.html':'/contact-build.html'
  };

  function resize(doc){
    if(!doc)return;
    var height=Math.max(doc.documentElement?doc.documentElement.scrollHeight:0,doc.body?doc.body.scrollHeight:0,900);
    frame.style.height=height+'px';
  }

  frame.addEventListener('load',function(){
    var doc=frame.contentDocument;
    if(!doc)return;

    var liveHeader=doc.getElementById('top');
    if(liveHeader)liveHeader.style.display='none';
    var liveFooter=doc.querySelector('footer');
    if(liveFooter)liveFooter.style.display='none';

    var theme=doc.createElement('link');
    theme.rel='stylesheet';
    theme.href='/css/finearts-build.css';
    doc.head.appendChild(theme);

    var hero=doc.querySelector('.boutique-hero,.process-hero');
    if(hero)hero.classList.add('finearts-hero');

    doc.querySelectorAll('a[href]').forEach(function(link){
      var raw=link.getAttribute('href');
      if(buildLinks[raw])link.setAttribute('href',buildLinks[raw]);
      if(raw&&!raw.startsWith('#')&&!raw.startsWith('javascript:'))link.setAttribute('target','_top');
    });

    resize(doc);
    if(window.ResizeObserver&&doc.body){
      var observer=new ResizeObserver(function(){resize(doc);});
      observer.observe(doc.body);
    }
    setTimeout(function(){resize(doc);},500);
    setTimeout(function(){resize(doc);},1800);
  });
})();
</script>
</body>
</html>
