  <link type="text/css" rel="stylesheet" href="css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700,700i,800,800i" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans|Open+Sans+Condensed:300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/animate.css">
  <link rel="stylesheet" href="css/art-style.css">
  <link rel="stylesheet" href="css/build-style.css">
  <link rel="stylesheet" href="css/build-review.css">

</head>
<body class="page-template page art-build-preview">
<a class="build-skip" href="#fineArtsPreview">Skip to content</a>
<header class="build-site-header">
  <div class="build-top-tabs">
    <ul class="build-tabs">
      <li class="active"><a href="finearts-build.html" aria-current="page">FINE ARTS</a></li>
      <li><a href="work-build.html">TECHNICAL WORK</a></li>
    </ul>
  </div>
  <div class="build-main-nav">
    <div class="build-main-nav-inner">
      <a class="build-site-brand" href="/index.html">SUSAN DELGADO</a>
      <nav class="build-site-links" aria-label="Fine Arts preview navigation">
        <a href="finearts-build.html" aria-current="page">FINE ARTS</a>
        <a href="about-build.html">ABOUT</a>
        <a href="exhibits-build.html">EXHIBITIONS</a>
        <a href="progress-chronicles-build.html">PROGRESS CHRONICLES</a>
        <a href="contact-build.html">CONTACT</a>
      </nav>
    </div>
  </div>
</header>
<div id="fineArtsPreview" aria-live="polite">
  <div class="container py-5 text-center text-muted">Loading the current Fine Arts page…</div>
</div>
<script>
(function(){
  var mount=document.getElementById('fineArtsPreview');
  var galleryBuilds={
    '/narrative-gallery.html':'narrative-gallery-build.html',
    'narrative-gallery.html':'narrative-gallery-build.html',
    '/wildlife-gallery.html':'wildlife-gallery-build.html',
    'wildlife-gallery.html':'wildlife-gallery-build.html',
    '/decorative-gallery.html':'decorative-gallery-build.html',
    'decorative-gallery.html':'decorative-gallery-build.html',
    '/studies-gallery.html':'studies-gallery-build.html',
    'studies-gallery.html':'studies-gallery-build.html'
  };

  fetch('/finearts.html',{cache:'no-store'})
    .then(function(response){if(!response.ok)throw new Error('Fine Arts page unavailable');return response.text();})
    .then(function(source){
      var parsed=new DOMParser().parseFromString(source,'text/html');
      var main=parsed.querySelector('main');
      var footer=parsed.querySelector('footer');
      if(!main)throw new Error('Fine Arts content unavailable');

      var importedMain=document.importNode(main,true);
      importedMain.querySelectorAll('a[href]').forEach(function(link){
        var raw=link.getAttribute('href');
        if(galleryBuilds[raw]) link.setAttribute('href',galleryBuilds[raw]);
      });

      mount.innerHTML='';
      mount.appendChild(importedMain);
      if(footer && !importedMain.querySelector('footer')){
        mount.appendChild(document.importNode(footer,true));
      }

      mount.querySelectorAll('.process-video').forEach(function(video){
        video.muted=true;
        video.play().catch(function(){});
      });
    })
    .catch(function(){
      mount.innerHTML='<div class="container py-5 text-center"><p>The Fine Arts preview could not be loaded. <a href="/finearts.html">Open the current Fine Arts page.</a></p></div>';
    });
})();
</script>
</body>
</html>
