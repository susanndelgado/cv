    <script>
      (function () {
        var root = document.getElementById("projectContent");
        if (!root) return;

        var previewSourceState = {
          id: "",
          status: "idle",
          html: "",
        };

        function currentProjectId() {
          return (
            root.dataset.projectId ||
            new URLSearchParams(window.location.search).get("post") ||
            "23"
          );
        }

        function removeHeroExtras() {
          root
            .querySelectorAll("#caseHero .case-summary")
            .forEach(function (summary) {
              summary.remove();
            });

          root
            .querySelectorAll("#caseHero .case-taxonomy-group")
            .forEach(function (group) {
              var label = group.querySelector(".case-taxonomy-label");
              if (label && label.textContent.trim() === "Category")
                group.remove();
            });

          var taxonomy = root.querySelector("#caseHero .case-taxonomy");
          if (taxonomy && !taxonomy.children.length) taxonomy.remove();
        }

        function normalizePreviewImages() {
          root.querySelectorAll("#projectPreview img").forEach(function (img) {
            var src = (img.getAttribute("src") || "").trim();

            if (
              !src ||
              /^(?:https?:)?\/\//i.test(src) ||
              /^(?:data|blob):/i.test(src) ||
              src.charAt(0) === "/"
            ) {
              return;
            }

            src = src.replace(/^\.\//, "");

            if (src.indexOf("../showcase/") === 0) {
              src = src.replace(/^\.\.\//, "");
            }

            if (src.indexOf("showcase/") === 0) {
              src = "/" + src;
            } else if (
              src.indexOf("img/") === 0 ||
              src.indexOf("thumbs/") === 0
            ) {
              src = "/showcase/" + src;
            } else {
              src = "/" + src;
            }

            img.setAttribute("src", src);
          });
        }

        function sanitizePreview(preview) {
          preview
            .querySelectorAll("script,style,link,header,nav,footer")
            .forEach(function (element) {
              element.remove();
            });
        }

        function applyMappedPreview() {
          var id = currentProjectId();
          if (
            previewSourceState.status !== "loaded" ||
            previewSourceState.id !== id ||
            !previewSourceState.html
          ) {
            return false;
          }

          var preview = root.querySelector("#projectPreview");
          if (!preview) return false;
          if (preview.dataset.previewSourceLoaded === id) return true;

          preview.innerHTML = previewSourceState.html;
          preview.dataset.previewSourceLoaded = id;
          sanitizePreview(preview);
          normalizePreviewImages();

          var visualSection = root.querySelector("#visualSection");
          if (
            visualSection &&
            (preview.querySelector("img") || preview.textContent.trim())
          ) {
            visualSection.hidden = false;
          }

          return true;
        }

        function ensurePreviewFallback() {
          if (
            previewSourceState.status !== "none" &&
            previewSourceState.status !== "failed"
          ) {
            return;
          }

          var preview = root.querySelector("#projectPreview");
          var visualSection = root.querySelector("#visualSection");
          if (!preview || preview.querySelector("img")) return;

          var heroImage = root.querySelector("#caseHero .case-visual img");
          if (!heroImage || !heroImage.getAttribute("src")) return;

          var container = document.createElement("div");
          var row = document.createElement("div");
          var column = document.createElement("div");
          var image = heroImage.cloneNode(false);

          container.className = "container";
          row.className = "row";
          column.className = "col-lg-12 col-md-12 col-sm-12";
          image.className = "responsive";
          image.loading = "lazy";
          image.setAttribute("data-preview-size", "standard");
          image.alt = heroImage.alt || "Project preview";

          column.appendChild(image);
          row.appendChild(column);
          container.appendChild(row);
          preview.appendChild(container);

          if (visualSection) visualSection.hidden = false;
        }

        function loadMappedPreview() {
          var id = currentProjectId();
          if (!id) return;

          if (
            previewSourceState.id === id &&
            (previewSourceState.status === "loading" ||
              previewSourceState.status === "loaded" ||
              previewSourceState.status === "none")
          ) {
            return;
          }

          previewSourceState.id = id;
          previewSourceState.status = "loading";
          previewSourceState.html = "";

          fetch("/js/casestudies.json")
            .then(function (response) {
              if (!response.ok)
                throw new Error("Preview source map unavailable");
              return response.json();
            })
            .then(function (data) {
              var source = data.previewSources && data.previewSources[id];
              if (!source) {
                previewSourceState.status = "none";
                ensurePreviewFallback();
                return null;
              }

              if (source.charAt(0) !== "/") source = "/" + source;
              return fetch(source).then(function (response) {
                if (!response.ok)
                  throw new Error("Project preview source unavailable");
                return response.text();
              });
            })
            .then(function (html) {
              if (html === null || html === undefined) return;
              if (previewSourceState.id !== id) return;
              previewSourceState.html = html;
              previewSourceState.status = "loaded";
              applyMappedPreview();
            })
            .catch(function (error) {
              console.error("Project preview load error:", error);
              if (previewSourceState.id !== id) return;
              previewSourceState.status = "failed";
              ensurePreviewFallback();
            });
        }

        function refreshProjectPreviews() {
          removeHeroExtras();
          normalizePreviewImages();
          applyMappedPreview();
          loadMappedPreview();
          ensurePreviewFallback();
        }

        refreshProjectPreviews();

        var observer = new MutationObserver(function () {
          refreshProjectPreviews();
        });

        observer.observe(root, { childList: true, subtree: true });
      })();
    </script>
