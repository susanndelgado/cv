# Deploy the static portfolio to GitHub Pages after applying sitewide SEO/schema and integrity checks.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These shared display corrections must live in the repository itself.
      # GitHub also performs a branch-based Pages build, so relying only on
      # artifact-time transformations can cause the raw source to reappear.
      - name: Normalize shared source sections
        run: python3 scripts/finalize_display.py

      - name: Persist normalized HTML source
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Shared HTML source is already normalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.html'
            git commit -m "Persist shared layout and community fixes [skip ci]"
            git push origin HEAD:main
          fi

      - name: Ignore JavaScript template paths during static link validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare_site.py')
          text = path.read_text(encoding='utf-8')
          old = "if not raw or raw.startswith(('#', 'mailto:', 'tel:', 'javascript:', 'data:')):"
          new = "if not raw or '${' in raw or raw.startswith(('#', 'mailto:', 'tel:', 'javascript:', 'data:')):"
          if old not in text:
              raise SystemExit('Validator pattern was not found; preparation script changed unexpectedly.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prepare site and validate links
        run: python3 scripts/prepare_site.py

      - name: Finalize shared display sections
        run: python3 scripts/finalize_display.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
