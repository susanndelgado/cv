name: Update splash navigation links

on:
  push:
    branches:
      - agent/splash-landing-page

permissions:
  contents: write

jobs:
  update-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/splash-landing-page
          fetch-depth: 0

      - name: Point Fine Arts navigation to finearts.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('href="/">FINE ARTS</a>', 'href="/finearts.html">FINE ARTS</a>')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          workflow = Path('.github/workflows/update-splash-links.yml')
          if workflow.exists():
              workflow.unlink()

          print('Updated Fine Arts links in:')
          for item in changed:
              print(' -', item)
          PY

      - name: Commit navigation cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
            exit 0
          fi
          git commit -m "Point Fine Arts navigation to finearts page"
          git push origin HEAD:agent/splash-landing-page
