name: Fix Dallas and WLNC project records

on:
  push:
    branches:
      - fix/dallas-wlnc-roles

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dallas-wlnc-roles
      - name: Correct Dallas and WLNC project history
        shell: python
        run: |
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def add_angular(skills):
              skills = skills or ''
              if 'AngularJS' in skills:
                  return skills
              if 'jQuery<br>' in skills:
                  return skills.replace('jQuery<br>', 'jQuery<br>AngularJS<br>', 1)
              return skills + ('<br>' if skills and not skills.endswith('<br>') else '') + 'AngularJS'

          # Dallas Leipzig: AngularJS was part of the 2016 front-end stack.
          base = load('js/posts.json')
          by_id = {str(p.get('id')): p for p in base.get('posts', [])}
          dallas = by_id['16']
          dallas['skills'] = add_angular(dallas.get('skills'))
          dallas['content'] = '<p>Dallas Leipzig was a cardiovascular education conference website developed through CRF.</p><p>Developed the responsive conference website as the assigned CRF front-end developer, including animated transitions between sliders, collapsing elements and active interface states.</p><p>The site used PHP, SCSS, jQuery, AngularJS, Bootstrap and custom JavaScript, including front-end animation used to enrich the interface and transitions.</p>'
          save('js/posts.json', base)

          # WLNCMD: website design and front-end development were completed as part of the CRF team.
          extra = load('js/posts-extra.json')
          extra_by_id = {str(p.get('id')): p for p in extra.get('posts', [])}
          wlnc = extra_by_id['47']
          wlnc['title'] = 'WLNCMD WEBSITE & EMAIL'
          wlnc['client'] = 'The Cardiovascular Research Foundation (CRF)'
          wlnc['summary'] = 'Website design, front-end development and supporting email communications for WLNCMD.'
          wlnc['role'] = 'Web Designer<br>Front End Developer<br>Email Developer<br>CRF Employee'
          wlnc['skills'] = 'Web Design<br>Front End Development<br>Responsive Web Development<br>HTML5<br>CSS<br>JavaScript<br>jQuery<br>Salesforce Pardot<br>Email Development<br>Email Scheduling & Distribution'
          wlnc['content'] = '<p>WLNCMD was a satellite website produced through CRF’s conference web program.</p><p>Designed the website presentation and developed the responsive front-end experience as part of the CRF team, implementing program content using HTML5, CSS, JavaScript and jQuery.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF web and email production workflow.</p>'
          save('js/posts-extra.json', extra)

          # Keep the effective correction layer aligned with the source records.
          corr = load('js/posts-corrections.json')
          ov = corr.setdefault('overrides', {})

          dallas = ov['16']
          dallas['skills'] = add_angular(dallas.get('skills'))
          dallas['content'] = '<p>Dallas Leipzig was a cardiovascular education conference designed for multidisciplinary cardiovascular teams, including cardiothoracic surgeons, cardiologists, anesthesiologists, nurses, technicians, nurse practitioners, perfusionists and cardiac imaging specialists.</p><p>Developed the conference website as the assigned CRF front-end developer, building animated transitions between sliders, collapsing elements and active interface states.</p><p>The responsive site used PHP, SCSS, jQuery, AngularJS, Bootstrap and custom JavaScript, including an independently developed animation module using animate.css to enrich the interface and transitions.</p>'

          wlnc = ov['47']
          wlnc['title'] = 'WLNCMD WEBSITE & EMAIL'
          wlnc['client'] = 'The Cardiovascular Research Foundation (CRF)'
          wlnc['role'] = 'Web Designer<br>Front End Developer<br>Email Developer<br>CRF Employee'
          wlnc['skills'] = 'Web Design<br>Front End Development<br>Responsive Web Development<br>HTML5<br>CSS<br>JavaScript<br>jQuery<br>Salesforce Pardot<br>Email Development<br>Email Scheduling & Distribution'
          wlnc['summary'] = 'Website design, front-end development and supporting email communications for WLNCMD.'
          wlnc['content'] = '<p>WLNCMD was a satellite website produced through CRF’s conference web program.</p><p>Designed the website presentation and developed the responsive front-end experience as part of the CRF team, implementing program content using HTML5, CSS, JavaScript and jQuery.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF web and email production workflow.</p>'

          save('js/posts-corrections.json', corr)
      - name: Commit corrected project data
        run: |
          git config user.name "Susan Delgado"
          git config user.email "susanndelgado@gmail.com"
          git add js/posts.json js/posts-extra.json js/posts-corrections.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Correct Dallas Angular and WLNC design role"
            git push origin HEAD:fix/dallas-wlnc-roles
          fi
