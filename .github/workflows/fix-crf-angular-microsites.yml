name: Fix CRF Angular microsites

on:
  push:
    branches:
      - fix/crf-angular-microsites

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crf-angular-microsites
      - name: Correct AngularJS technology history
        shell: python
        run: |
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def add_angular(skills):
              skills = skills or ''
              if 'AngularJS' in skills:
                  return skills
              if 'jQuery<br>' in skills:
                  return skills.replace('jQuery<br>', 'jQuery<br>AngularJS<br>', 1)
              if skills:
                  return skills + ('<br>' if not skills.endswith('<br>') else '') + 'AngularJS'
              return 'AngularJS'

          # Base posts: ABIOMED 2017 and SCAI 2016.
          base = load('js/posts.json')
          by_id = {str(p.get('id')): p for p in base.get('posts', [])}

          p = by_id['11']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>ABIOMED 2017 was a sponsor microsite developed within the Cardiovascular Research Foundation’s conference web program. It functioned as one of the satellite sites CRF hosted for conference sponsors rather than as a standalone CRF conference website.</p><p>Front-end development included implementing the AngularJS-based microsite structure, responsive page content and interactive elements using HTML5, CSS, JavaScript, jQuery, AngularJS and Bootstrap within CRF’s established sponsor-site framework.</p>'

          p = by_id['18']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>Website and email materials were developed for SCAI 2016 as part of CRF’s conference-related web production work.</p><p>The project combined AngularJS-based front-end website implementation with supporting responsive email development, carrying the conference information across web and digital communications.</p>'
          save('js/posts.json', base)

          # Extra posts: TVT 2015, TRAC 2015–2016 and SCAI 2017.
          extra = load('js/posts-extra.json')
          extra_by_id = {str(p.get('id')): p for p in extra.get('posts', [])}

          p = extra_by_id['39']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>TVT 2015 was a CRF conference microsite developed as part of the organization’s cardiovascular education programming.</p><p>Developed the AngularJS-based responsive website experience across desktop, tablet and mobile layouts, implemented conference content, and developed, scheduled and distributed supporting Salesforce Pardot email communications.</p>'

          p = extra_by_id['44']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>TRAC conference work included an AngularJS-based responsive event website and supporting digital communications developed through CRF.</p><p>The website included conference overview, faculty, registration and other event content across desktop and mobile layouts. Supporting responsive emails were also developed and distributed as part of the conference communications.</p>'

          p = extra_by_id['45']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>Website and responsive email development were completed for SCAI 2017 as part of CRF’s conference production work.</p><p>The responsive conference website was implemented with AngularJS as part of the front-end stack, with supporting Salesforce Pardot email communications developed for the event.</p>'
          save('js/posts-extra.json', extra)

          # Effective correction layer: keep the richer descriptions while correcting the stack.
          corr = load('js/posts-corrections.json')
          ov = corr.setdefault('overrides', {})

          p = ov['11']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>ABIOMED was a cardiovascular medical-device company focused on heart-recovery technology, including the Impella heart-pump platform. The 2017 project was a sponsor microsite developed within CRF’s conference ecosystem to provide dedicated event content for the company.</p><p>Developed the AngularJS-based responsive sponsor microsite and implemented the website content using HTML/CSS, JavaScript, jQuery, AngularJS and Bootstrap.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF front-end and email development role.</p>'

          p = ov['18']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>The Society for Cardiovascular Angiography &amp; Interventions (SCAI) is a nonprofit professional medical society dedicated to interventional cardiology, with work spanning education, advocacy, research and quality patient care. SCAI 2016 website and email materials were produced through CRF’s conference development program.</p><p>Developed the AngularJS-based responsive conference website and implemented program content using HTML5, CSS, JavaScript, jQuery and AngularJS.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF front-end and email development role.</p>'

          p = ov['39']
          p['skills'] = add_angular(p.get('skills', 'Front End Development<br>Responsive Web Development<br>HTML5<br>CSS<br>JavaScript<br>jQuery<br>Bootstrap<br>Salesforce Pardot<br>Email Development<br>Email Scheduling & Distribution'))
          p['content'] = '<p>TVT 2015 was a CRF conference microsite developed as part of the organization’s cardiovascular education programming and conference communications.</p><p>Developed the AngularJS-based responsive website experience across desktop, tablet and mobile layouts and implemented the conference content within CRF’s established web environment.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF front-end and email development role.</p>'

          p = ov['44']
          p['skills'] = add_angular(p.get('skills', 'Front End Development<br>Responsive Web Development<br>HTML5<br>CSS<br>JavaScript<br>jQuery<br>Joomla<br>Bootstrap<br>Email Development<br>Salesforce Pardot'))
          p['content'] = '<p>TRAC conference work included an AngularJS-based responsive event website and supporting communications developed through CRF for the program’s attendees and faculty.</p><p>Developed conference overview, faculty, registration and related event pages across desktop and mobile layouts using HTML5, CSS, JavaScript, jQuery, AngularJS, Joomla and Bootstrap.</p><p>Developed and distributed the responsive supporting email campaign through Salesforce Pardot as part of the CRF conference production workflow.</p>'

          p = ov['45']
          p['skills'] = add_angular(p.get('skills'))
          p['content'] = '<p>The Society for Cardiovascular Angiography &amp; Interventions (SCAI) is a nonprofit professional medical society dedicated to interventional cardiology, with work spanning education, advocacy, research and quality patient care. SCAI 2017 website and email materials were produced through CRF’s conference production program.</p><p>Developed the AngularJS-based responsive conference web content and implemented the program presentation using HTML5, CSS, JavaScript, jQuery and AngularJS.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF front-end and email development role.</p>'

          save('js/posts-corrections.json', corr)
      - name: Commit corrected project data
        run: |
          git config user.name "Susan Delgado"
          git config user.email "susanndelgado@gmail.com"
          git add js/posts.json js/posts-extra.json js/posts-corrections.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Correct AngularJS use in CRF microsites"
            git push origin HEAD:fix/crf-angular-microsites
          fi
