name: Fix DFW organization tense

on:
  push:
    branches:
      - fix/dfw-present-tense

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change DFW organization description to present tense
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/posts-corrections.json')
          text = path.read_text(encoding='utf-8')
          old = 'DFW Private Education was a Dallas–Fort Worth private-school directory and family education resource that promoted local private schools, school events and educational services.'
          new = 'DFW Private Education is a Dallas–Fort Worth private-school directory and family education resource that promotes local private schools, school events and educational services.'
          count = text.count(old)
          if count != 6:
              raise SystemExit(f'Expected 6 DFW organization descriptions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-dfw-tense.yml
      - name: Commit corrected wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/posts-corrections.json .github/workflows/fix-dfw-tense.yml
          git commit -m "Use present tense for DFW Private Education"
          git push
