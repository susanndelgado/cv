name: Fix work skills and WLNCMD Joomla

on:
  push:
    branches:
      - fix/work-skills-wlncmd-joomla

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work-skills-wlncmd-joomla
      - name: Apply requested portfolio corrections
        shell: python
        run: |
          import json
          from pathlib import Path

          work_path = Path('work.html')
          text = work_path.read_text(encoding='utf-8')
          old = "HTML5/CSS: Understanding standard compliant html4, html5, Css3, Responsive, Adaptive, Elastic Web development, Cross-browse compatibility for Mobile browsers, iOS, Chrome, Safari, Opera, monzilla, Bing and most Enternet Explorer. CMS: WordPress, WP Themes, WP Child Themes, JoomlaVersion control: Git version control, Bitbucket, Source Tree, Terminal Command, SSH, and more PHP, Javascript, jQuery, AJAX, Angularjs, Node, Gulp, Less, Sass, Compass, TweenLight, Animation.css, Modernizr, Bootstrap, jQuery UI, Zurb, Masonary, Rapheal Js, etc.. APIs and Restful Services. Email Campaign Development in Pardot, Mailchimp, and more."
          new = "HTML5/CSS: Understanding standard compliant html4, html5, Css3, Responsive, Adaptive, Elastic Web development, Cross-browse compatibility. CMS: WordPress, WP Themes, WP Child Themes, JoomlaVersion control: Git version control, Bitbucket, Source Tree, Terminal Command, SSH, and more PHP, Javascript, jQuery, AJAX, Angularjs, Node, Gulp, Less, Sass, Compass, TweenLight, Animation.css, Modernizr, Bootstrap, jQuery UI, Zurb, Masonary, Rapheal Js, etc.. APIs and Restful Services. Email Campaign Development in Pardot, Mailchimp, and more. Current development tools: Docker Desktop, Docker Compose, PostgreSQL, pgAdmin, YAML, Visual Studio Code (VS Code), macOS Terminal."
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Web Development paragraph match, found {text.count(old)}')
          work_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          wln_content = "<p>WLNCMD was a Joomla satellite website produced through CRF’s conference web program.</p><p>Designed the website and handled front-end development as part of the CRF team, implementing the responsive site and program content using Joomla, HTML5, CSS, JavaScript and jQuery.</p><p>Developed, scheduled and distributed the supporting Salesforce Pardot email communications as part of the CRF web and email production workflow.</p>"
          wln_skills = "Web Design<br>Front End Development<br>Responsive Web Development<br>Joomla<br>HTML5<br>CSS<br>JavaScript<br>jQuery<br>Salesforce Pardot<br>Email Development<br>Email Scheduling & Distribution"

          for filename in ('js/posts-extra.json', 'js/posts-corrections.json'):
              path = Path(filename)
              data = json.loads(path.read_text(encoding='utf-8'))
              if filename.endswith('posts-extra.json'):
                  matches = [p for p in data.get('posts', []) if str(p.get('id')) == '47']
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one WLNCMD post in {filename}, found {len(matches)}')
                  post = matches[0]
              else:
                  post = data.get('overrides', {}).get('47')
                  if not post:
                      raise SystemExit('WLNCMD override 47 not found')
              post['role'] = 'Web Designer<br>Front End Developer<br>Email Developer<br>CRF Employee'
              post['skills'] = wln_skills
              post['summary'] = 'Joomla website design, front-end development and supporting email communications for WLNCMD.'
              post['content'] = wln_content
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit requested changes
        run: |
          git config user.name "Susan Delgado"
          git config user.email "susanndelgado@gmail.com"
          git add work.html js/posts-extra.json js/posts-corrections.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update work skills and WLNCMD Joomla details"
            git push origin HEAD:fix/work-skills-wlncmd-joomla
          fi
