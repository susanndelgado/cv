name: Apply work portfolio CTA and practice wording

on:
  push:
    branches:
      - fix/work-portfolio-cta-practice
    paths:
      - .github/workflows/apply-work-portfolio-cta.yml

permissions:
  contents: write

jobs:
  edit-work-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Update work page
        shell: python
        run: |
          from pathlib import Path

          path = Path("work.html")
          text = path.read_text(encoding="utf-8")

          old_cta = '''          <!-- <a class="sandbox-button" href="#case-studies">
            <span>Veiw Work</span>
            <span aria-hidden="true">↗</span>
          </a> -->
          <a class="sandbox-button" href="https://sandbox.sdelgado.com/">
            <span>Enter Sandbox</span>
            <span aria-hidden="true">↗</span>
          </a>'''

          new_cta = '''          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a class="sandbox-button" href="#case-studies">
              <span>View Selected Work</span>
              <span aria-hidden="true">↓</span>
            </a>
            <a class="sandbox-button" href="https://sandbox.sdelgado.com/">
              <span>Enter Sandbox</span>
              <span aria-hidden="true">↗</span>
            </a>
          </div>'''

          old_practice = '''              <h3>Current development focus</h3>
              <p>
                Current study refreshes the workflow around tooling expected in
                modern web teams while retaining practical production experience
                from client and corporate work.
              </p>'''

          new_practice = '''              <h3>Current technical practice</h3>
              <p>
                Current technical practice expands modern web-development tooling
                while building on practical production experience from client and
                corporate work.
              </p>'''

          if old_cta not in text:
              raise SystemExit("Expected hero CTA block was not found")
          if old_practice not in text:
              raise SystemExit("Expected current development block was not found")

          text = text.replace(old_cta, new_cta, 1)
          text = text.replace(old_practice, new_practice, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work.html
          git commit -m "Add selected work CTA and rename technical practice"
          git push
