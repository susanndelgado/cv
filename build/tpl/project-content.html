<!--
  Reusable project-content template.
  Header, navigation, page shell, and footer stay in build/project.html.
  global.js fills only the sections that have matching project data.
-->
<div class="container">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <section class="case-hero">
        <div class="shell">
          <nav
            id="caseNavTop"
            class="case-nav"
            aria-label="Project navigation"
          ></nav>

          <div id="caseHero" class="status">Loading project…</div>
        </div>
      </section>

      <section class="section white" id="caseContext" hidden>
        <div class="shell case-content">
          <div>
            <p class="kicker">Project overview</p>
            <h2>Context</h2>
          </div>

          <div id="caseNarrative" class="rich-copy"></div>
        </div>
      </section>

      <section class="section" id="uxSection" hidden>
        <div class="shell">
          <div class="section-head">
            <div>
              <p class="kicker">Interface &amp; implementation</p>
              <h2 id="uxTitle"></h2>
              <p id="uxIntro"></p>
            </div>
          </div>

          <div id="uxPanels" class="split"></div>
        </div>
      </section>

      <section class="section white" id="workflowSection" hidden>
        <div class="shell">
          <div class="section-head">
            <div>
              <p class="kicker">Development approach</p>
              <h2>How the work moved through production</h2>
            </div>
          </div>

          <div id="workflowGrid" class="process-grid"></div>
        </div>
      </section>

      <section class="section" id="systemSection" hidden>
        <div class="shell">
          <div class="section-head">
            <div>
              <p class="kicker">Technical structure</p>
              <h2 id="systemTitle"></h2>
              <p id="systemIntro"></p>
            </div>
          </div>

          <div id="systemGrid" class="architecture"></div>
        </div>
      </section>

      <section class="section white" id="structureSection" hidden>
        <div class="shell">
          <div class="section-head">
            <div>
              <p class="kicker">Site structure</p>
              <h2 id="structureTitle"></h2>
              <p id="structureIntro"></p>
            </div>
          </div>

          <div id="structureGrid" class="site-structure"></div>
        </div>
      </section>

      <section class="section white" id="deliverableSection" hidden>
        <div class="shell">
          <div class="section-head">
            <div>
              <p class="kicker">Deliverables</p>
              <h2>Project deliverables</h2>
            </div>
          </div>

          <div id="deliverableGrid" class="deliverables"></div>
        </div>
      </section>

      <section class="section" id="visualSection" hidden>
        <div class="shell">
          <div class="section-head">
            <div>
              <p class="kicker">Project gallery</p>
              <h2>Screens &amp; production work</h2>
            </div>
          </div>

          <div id="projectPreview" class="preview-stack"></div>
        </div>
      </section>

      <div class="case-nav-bottom-wrap">
        <div class="shell">
          <nav
            id="caseNavBottom"
            class="case-nav"
            aria-label="Project navigation"
          ></nav>
        </div>
      </div>
    </div>
  </div>
</div>
