<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script><script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
(function(){
  var posts=[],currentPost=0;var hero=document.getElementById('hero'),info=document.getElementById('info'),details=document.getElementById('details'),content=document.getElementById('content');
  var prev=[document.getElementById('previousLinkTop'),document.getElementById('previousLinkBottom')],next=[document.getElementById('nextLinkTop'),document.getElementById('nextLinkBottom')];
  var lightbox=document.getElementById('previewLightbox'),lightboxImg=lightbox.querySelector('img');
  function cleanTitle(v){return String(v||'').replace(/<[^>]*>/g,'');}
  function yearValue(v){var m=String(v||'').match(/\d{4}/);return m?parseInt(m[0],10):0;}
  function sortPosts(a,b){var y=yearValue(b.year)-yearValue(a.year);if(y)return y;var c=String(a.client||'').localeCompare(String(b.client||''));return c||cleanTitle(a.title).localeCompare(cleanTitle(b.title));}
  function mergeData(base,extra){var overrides=(extra&&extra.overrides)||{};var result=(base||[]).map(function(p){return Object.assign({},p,overrides[String(p.id)]||{});});((extra&&extra.posts)||[]).forEach(function(p){if(!result.some(function(x){return String(x.id)===String(p.id);})){result.push(p);}});return result.sort(sortPosts);}
  function setURL(){var u=new URL(location.href);u.searchParams.set('post',posts[currentPost].id);history.pushState({post:posts[currentPost].id},'',u);}
  function setStates(){prev.forEach(function(a){a.classList.toggle('disabled',currentPost===0);});next.forEach(function(a){a.classList.toggle('disabled',currentPost===posts.length-1);});}
  function renderHero(post){
    var compact=post.heroLayout==='compact';var src='/'+(post.image||post.thumb||'');var title=cleanTitle(post.title);
    if(compact){hero.innerHTML='<div class="showcase-hero-compact"><div class="hero-image"><img id="heroImage" src="'+src+'" alt="'+title+'"></div><div class="hero-title"><h1>'+title+'</h1></div></div>';}else{hero.innerHTML='<div class="showcase-hero-normal"><img id="heroImage" src="'+src+'" alt="'+title+'"></div>';}
    var img=document.getElementById('heroImage');if(!img)return;img.addEventListener('error',function(){var fallback=post.thumb&&post.thumb!==post.image?'/'+post.thumb:'';if(fallback&&img.dataset.fallback!=='1'){img.dataset.fallback='1';img.src=fallback;return;}var wrap=img.parentNode;wrap.innerHTML='<div class="preview-placeholder">Project header image is pending.</div>';});
  }
  function classifyImage(img){if(img.dataset.previewSize){img.classList.add('preview-'+img.dataset.previewSize);return;}var r=img.naturalWidth&&img.naturalHeight?img.naturalWidth/img.naturalHeight:1;if(r>=1.6)img.classList.add('preview-spread');else if(r<=.82)img.classList.add('preview-document');else img.classList.add('preview-standard');}
  function enhancePreviews(){content.querySelectorAll('img').forEach(function(img){img.classList.add('preview-clickable');function ready(){classifyImage(img);}if(img.complete)ready();else img.addEventListener('load',ready,{once:true});img.addEventListener('click',function(){if(!img.src)return;lightboxImg.src=img.src;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');});});}
  function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');lightboxImg.src='';}
  lightbox.addEventListener('click',function(e){if(e.target===lightbox||e.target.tagName==='BUTTON')closeLightbox();});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});
  function loadPost(push){if(!posts.length)return;var post=posts[currentPost];if(push)setURL();document.title=cleanTitle(post.title)+' | Susan Delgado';renderHero(post);info.innerHTML='<h3>CLIENT / COMPANY</h3><p>'+(post.client||'')+'</p><h3>ROLE</h3><p>'+(post.role||'')+'</p><h3>UTILIZED SKILLS</h3><p>'+(post.skills||'')+'</p>';details.innerHTML='<h3 class="project-heading">'+post.title+'</h3>'+(post.content||'');content.innerHTML='';fetch('/'+post.link).then(function(r){if(!r.ok)throw new Error();return r.text();}).then(function(html){content.innerHTML=html;enhancePreviews();}).catch(function(){content.innerHTML='<div class="container"><div class="preview-placeholder">Project preview is temporarily unavailable.</div></div>';});setStates();window.scrollTo(0,0);}
  function move(delta){var n=currentPost+delta;if(n>=0&&n<posts.length){currentPost=n;loadPost(true);}}
  prev.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();move(-1);});});next.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();move(1);});});
  function setCurrentFromURL(){var q=new URLSearchParams(location.search).get('post');var idx=posts.findIndex(function(p){return String(p.id)===String(q);});currentPost=idx>=0?idx:0;}
  window.addEventListener('popstate',function(){setCurrentFromURL();loadPost(false);});
  Promise.all([fetch('/js/posts.json').then(function(r){return r.json();}),fetch('/js/posts-extra.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};})]).then(function(data){posts=mergeData(data[0].posts||[],data[1]||{});setCurrentFromURL();loadPost(false);});
})();
</script>
