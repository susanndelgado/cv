<script>
(function(){
  var posts=[],currentPost=0;
  var hero=document.getElementById('hero'),info=document.getElementById('info'),details=document.getElementById('details'),content=document.getElementById('content');
  var prev=[document.getElementById('previousLinkTop'),document.getElementById('previousLinkBottom')],next=[document.getElementById('nextLinkTop'),document.getElementById('nextLinkBottom')];
  function cleanTitle(value){return String(value||'').replace(/<[^>]*>/g,'');}
  function setURL(){var u=new URL(window.location.href);u.searchParams.set('post',currentPost);history.pushState({post:currentPost},'',u);}
  function setStates(){prev.forEach(function(a){a.classList.toggle('disabled',currentPost===0);});next.forEach(function(a){a.classList.toggle('disabled',currentPost===posts.length-1);});}
  function loadPost(push){
    if(!posts.length)return;var post=posts[currentPost];if(push)setURL();
    document.title=cleanTitle(post.title)+' | Susan Delgado';
    hero.innerHTML='<center><img class="responsive showcase" src="/'+post.image+'" alt="'+cleanTitle(post.title)+'"></center>';
    info.innerHTML='<h3>CLIENT / COMPANY</h3><p>'+post.client+'</p><h3>ROLE</h3><p>'+post.role+'</p><h3>UTILIZED SKILLS</h3><p>'+post.skills+'</p>';
    details.innerHTML='<h3 class="project-heading">'+post.title+'</h3>'+post.content;
    content.innerHTML='';
    fetch('/'+post.link).then(function(r){if(!r.ok)throw new Error();return r.text();}).then(function(html){content.innerHTML=html;}).catch(function(){content.innerHTML='<div class="container"><p>Project preview is temporarily unavailable.</p></div>';});
    setStates();window.scrollTo(0,0);
  }
  function move(delta){var n=currentPost+delta;if(n>=0&&n<posts.length){currentPost=n;loadPost(true);}}
  prev.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();move(-1);});});next.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();move(1);});});
  window.addEventListener('popstate',function(){var p=parseInt(new URLSearchParams(location.search).get('post'),10);currentPost=!isNaN(p)&&p>=0&&p<posts.length?p:0;loadPost(false);});
  fetch('/js/posts.json').then(function(r){return r.json();}).then(function(data){
    posts=data.posts||[];
    var p=parseInt(new URLSearchParams(location.search).get('post'),10);currentPost=!isNaN(p)&&p>=0&&p<posts.length?p:0;loadPost(false);
  });
})();
</script>
