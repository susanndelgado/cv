  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link type="text/css" rel="stylesheet" href="css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700,700i,800,800i" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans|Open+Sans+Condensed:300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/xwc7tgb.css">
  <link rel="stylesheet" href="css/animate.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .work-intro{padding:70px 0 35px}.work-intro h1{margin-bottom:15px}.work-filters{padding:0 0 35px}.work-filters .btn{margin:4px 2px}.work-grid{display:flex;flex-wrap:wrap;margin:0 -15px 60px}.work-card{width:33.333%;padding:0 15px 36px}.work-card-inner{height:100%;background:#fff}.work-card-image{display:block;overflow:hidden;background:#f2f2f2}.work-card-image img{width:100%;height:245px;object-fit:cover;display:block;transition:transform .25s ease}.work-card-image:hover img{transform:scale(1.02)}.work-card-copy{padding:18px 4px}.work-card-copy h3{font-size:20px;line-height:1.25;margin:0 0 8px}.work-card-copy h3 a{color:inherit}.work-card-copy p{font-size:14px;line-height:1.5;margin:0}.work-card.hidden-project{display:none}@media(max-width:991px){.work-card{width:50%}}@media(max-width:575px){.work-card{width:100%}.work-card-image img{height:auto}}
  </style>
</head>
<body class="page-template page">
<header id="top" class="top">
  <div class="container-fluid">
    <ul class="nav nav-tabs">
      <li class="nav-item"><a class="nav-link" href="/">FINE ARTS</a></li>
      <li class="nav-item"><a class="nav-link active" href="/work.html">TECHNICAL WORK</a></li>
    </ul>
  </div>
  <nav class="navbar navbar-expand-lg navbar-light page-nav">
    <a class="navbar-brand" href="/index.html">SUSAN DELGADO</a>
    <button class="navbar-toggler collapsed" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="navbar-collapse collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ml-auto">
        <li class="active item"><a class="nav-link link" href="/work.html">TECHNICAL WORK</a></li>
        <li class="item"><a class="nav-link link" href="/showcase.html">SHOWCASE</a></li>
        <li class="item"><a class="nav-link link" href="/contact.html">CONTACT / RESUME</a></li>
      </ul>
    </div>
  </nav>
</header>
<main>
  <section class="work-intro">
    <div class="container">
      <h1>TECHNICAL WORK</h1>
      <p>Selected web development, digital design, branding, email, print and conference work.</p>
    </div>
  </section>
  <section class="work-filters">
    <div class="container" id="workFilters">
      <button class="btn btn-dark active" data-filter="all">ALL</button>
      <button class="btn btn-outline-dark" data-filter="web">WEB</button>
      <button class="btn btn-outline-dark" data-filter="dig">DIGITAL</button>
      <button class="btn btn-outline-dark" data-filter="brand">BRANDING</button>
      <button class="btn btn-outline-dark" data-filter="conf">CONFERENCE / EVENT</button>
      <button class="btn btn-outline-dark" data-filter="email">EMAIL</button>
      <button class="btn btn-outline-dark" data-filter="print">PRINT</button>
    </div>
  </section>
  <section>
    <div class="container"><div id="workGrid" class="work-grid"></div></div>
  </section>
</main>
<footer id="footer">
  <div class="container"><div class="row"><div class="col-lg-12"><button class="btn backtotop" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back To Top</button></div></div></div>
  <div class="container"><div class="row"><div class="col-lg-3 col-md-3 col-sm-12"><h2>Susan Delgado</h2><a href="mailto:sdelgado@collabdesigns.com">sdelgado@collabdesigns.com</a></div></div></div>
</footer>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
(function(){
  var grid=document.getElementById('workGrid');
  var buttons=document.querySelectorAll('#workFilters [data-filter]');
  var posts=[];
  function projectURL(post){return '/showcase.html?post='+encodeURIComponent(post.id);}
  function render(){
    grid.innerHTML='';
    posts.forEach(function(post){
      var card=document.createElement('article');
      card.className='work-card';
      card.dataset.filters=post.filters||'';
      var url=projectURL(post);
      card.innerHTML='<div class="work-card-inner">'+
        '<a class="work-card-image" href="'+url+'"><img src="/'+(post.thumb||post.image)+'" alt="'+String(post.title).replace(/<[^>]*>/g,'')+'"></a>'+
        '<div class="work-card-copy"><h3><a href="'+url+'">'+post.title+'</a></h3><p>'+(post.summary||'')+'</p></div></div>';
      grid.appendChild(card);
    });
    applyFilter('all');
  }
  function applyFilter(filter){
    document.querySelectorAll('.work-card').forEach(function(card){
      var show=filter==='all'||(' '+card.dataset.filters+' ').indexOf(' '+filter+' ')!==-1;
      card.classList.toggle('hidden-project',!show);
    });
    buttons.forEach(function(btn){
      var active=btn.dataset.filter===filter;
      btn.classList.toggle('btn-dark',active);btn.classList.toggle('btn-outline-dark',!active);btn.classList.toggle('active',active);
    });
  }
  buttons.forEach(function(btn){btn.addEventListener('click',function(){applyFilter(btn.dataset.filter);});});
  fetch('/js/posts.json').then(function(r){if(!r.ok)throw new Error('Unable to load projects');return r.json();}).then(function(data){posts=data.posts||[];render();}).catch(function(){grid.innerHTML='<p>Project list could not be loaded.</p>';});
})();
</script>
</body>
</html>
